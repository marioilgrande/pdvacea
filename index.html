<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Portale contratti | Manutenzione</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Aptos, "Segoe UI", Arial, sans-serif;
      color: #19343a;
      background: #f1f5f5;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: flex; flex-direction: column; }
    header {
      width: 100%;
      padding: 24px max(28px, calc((100vw - 1100px) / 2));
      border-bottom: 1px solid #dce6e7;
      background: #fff;
    }
    .brand { font-size: .9rem; font-weight: 800; color: #145d63; }
    main {
      width: min(100%, 1100px);
      margin: auto;
      padding: 64px 28px;
    }
    .content { max-width: 680px; }
    .status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: #126c70;
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }
    .status::before { content: ""; width: 28px; height: 3px; background: #0b8990; }
    h1 { margin: 0; max-width: 620px; font-size: 2.6rem; line-height: 1.14; font-weight: 750; }
    p { max-width: 590px; color: #52656a; font-size: 1.08rem; line-height: 1.65; }
    footer {
      width: 100%;
      padding: 20px max(28px, calc((100vw - 1100px) / 2));
      border-top: 1px solid #dce6e7;
      color: #617176;
      font-size: .85rem;
    }
    @media (max-width: 640px) {
      header, footer { padding-left: 20px; padding-right: 20px; }
      main { padding: 48px 20px; }
      h1 { font-size: 2rem; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header><div class="brand">PORTALE CONTRATTI</div></header>
  <main>
    <div class="content">
      <div class="status">Manutenzione temporanea</div>
      <h1>Il portale è temporaneamente non disponibile.</h1>
      <p>Stiamo effettuando un intervento di manutenzione. La compilazione e l'invio delle pratiche sono sospesi. Riprova più tardi.</p>
    </div>
  </main>
  <footer>Gestione pratiche PDV</footer>
</body>
</html>
